[package]
name = "node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Opt-in: needs a C toolchain to build the mimalloc allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
kernel       = { workspace = true }
persistence  = { workspace = true }
coordination = { workspace = true }
scheduling   = { workspace = true }
tasks        = { workspace = true }
messaging    = { workspace = true }
workflow     = { workspace = true }
feed         = { workspace = true }
expr         = { workspace = true }
api          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
mimalloc           = { workspace = true, optional = true }
