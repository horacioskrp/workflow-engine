# A workflow engine written in Rust.
#
# Virtual workspace: shared settings and dependency versions live here and are
# inherited by member crates (M-CARGO-WORKSPACE, M-CRATES-IN-WORKSPACE). All
# crates are siblings under `crates/` (M-CRATES-FLAT-FOLDER); they are organized
# by capability (workflow, scheduling, tasks, messaging) plus supporting crates.

[workspace]
resolver = "3"             # virtual workspaces don't infer this from edition (M-LATEST-EDITION)
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"           # latest stable edition (M-LATEST-EDITION)
rust-version = "1.90"      # MSRV, kept a few releases behind latest (M-MSRV)
license = "Apache-2.0"     # TODO: decide the project license
repository = "https://example.invalid/workflow-engine"

# --- Lints applied to every crate (M-STATIC-VERIFICATION, M-LINT-OVERRIDE-EXPECT) ---
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# --- Dependency versions, declared once (M-CARGO-WORKSPACE) -----------------------
[workspace.dependencies]
# Internal crates — intra-workspace deps resolve through here (M-CRATES-IN-WORKSPACE).
kernel       = { path = "crates/kernel",       version = "0.1.0" }
contracts    = { path = "crates/contracts",    version = "0.1.0" }
expr         = { path = "crates/expr",         version = "0.1.0" }
persistence  = { path = "crates/persistence",  version = "0.1.0" }
scheduling   = { path = "crates/scheduling",   version = "0.1.0" }
tasks        = { path = "crates/tasks",        version = "0.1.0" }
messaging    = { path = "crates/messaging",    version = "0.1.0" }
workflow     = { path = "crates/workflow",     version = "0.1.0" }
coordination = { path = "crates/coordination", version = "0.1.0" }
feed         = { path = "crates/feed",         version = "0.1.0" }
api          = { path = "crates/api",          version = "0.1.0" }
sdk          = { path = "crates/sdk",          version = "0.1.0" }
harness      = { path = "crates/harness",      version = "0.1.0" }

# Third-party — wired into the scaffold now (all pure-Rust: no C toolchain needed).
serde              = { version = "1",    features = ["derive"] }
anyhow             = { version = "1" }
tokio              = { version = "1",    default-features = false }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3",  default-features = false }

# gRPC stack — wired in Phase 0 (contracts). Defaults give codegen + transport.
tonic       = { version = "0.12" }   # gRPC server/client + generated traits
prost       = { version = "0.13" }   # protobuf runtime (messages)
tonic-build = { version = "0.12" }   # proto → Rust codegen (build-dependency)

# Third-party — reserved for upcoming phases. Versions pinned here for a single
# source of truth; not referenced by any crate yet, so not compiled until a
# member opts in with `<dep>.workspace = true`.
rmp-serde   = { version = "1" }                                # MessagePack payloads
rocksdb     = { version = "0.22", default-features = false }   # persistence backend — needs clang
openraft    = { version = "0.9",  default-features = false }   # coordination/replication
rustls      = { version = "0.23", default-features = false }   # TLS
thiserror   = { version = "2" }                                # error derive where a struct is overkill
mimalloc    = { version = "0.1",  default-features = false }   # node allocator — needs a C compiler
criterion   = { version = "0.5",  default-features = false }   # benchmarks
